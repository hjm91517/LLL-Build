name: Build Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/.theos

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack source payload
        run: |
          set -euo pipefail
          if ls payload.part* >/dev/null 2>&1; then
            echo "拼接 payload 分片"
            cat payload.part* > /tmp/payload.b64
          elif [ -f payload.b64 ]; then
            cp payload.b64 /tmp/payload.b64
          fi
          if [ -s /tmp/payload.b64 ]; then
            python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(open('/tmp/payload.b64','rb').read()))" > /tmp/src.tar.xz
            tar -xf /tmp/src.tar.xz -C .
          fi

      - name: Apply overlay
        run: |
          set -euo pipefail
          if [ -f overlay.b64 ]; then
            echo "应用 overlay 热修"
            python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(open('overlay.b64','rb').read()))" > /tmp/overlay.tar.xz
            tar -xf /tmp/overlay.tar.xz -C .
          fi
          test -f Makefile || { echo "!! 没有 Makefile"; exit 1; }
          grep -n "kPluginVersion" core/PluginInfo.h

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install host deps
        run: |
          brew update >/dev/null 2>&1 || true
          brew install ldid xz || brew upgrade ldid xz
          ldid -v 2>&1 | head -n 2 || true

      - name: Cache Theos + SDKs
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v5

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp
          cp -R /tmp/sdks-master/iPhoneOS16.5.sdk "$THEOS/sdks/"
          test -f "$THEOS/makefiles/common.mk"
          ls -1 "$THEOS/sdks"

      - name: Build (Theos)
        run: |
          set -euo pipefail
          make clean || true
          make all FINALPACKAGE=1 DEBUG=0 ARCHS="arm64 arm64e" TARGET="iphone:clang:latest:14.0"
          find .theos -name '*.dylib' -not -path '*dSYM*' | sort

      - name: Collect & sign
        run: |
          set -uo pipefail
          mkdir -p dist
          ENT=""
          if [ -f ".github/entitlements.plist" ]; then ENT=".github/entitlements.plist"; fi

          find . -name '*.dylib' -not -path './dist/*' -not -path './.git/*' -not -path '*dSYM*' | sort > /tmp/all.txt || true
          cat /tmp/all.txt

          best=""; bestn=0
          while IFS= read -r f; do
            file "$f" | grep -q 'Mach-O' || continue
            n=$(lipo -archs "$f" 2>/dev/null | wc -w | tr -d ' ')
            if [ -n "$n" ] && [ "$n" -gt "$bestn" ]; then bestn=$n; best="$f"; fi
          done < /tmp/all.txt

          test -n "$best" || { echo "!! 没有构建出 dylib"; exit 1; }
          cp -f "$best" dist/bbhj_online.dylib

          if [ "$bestn" -le 1 ]; then
            slices=$(ls .theos/obj/*/bbhj_online.dylib 2>/dev/null || true)
            if [ -n "$slices" ]; then lipo -create -output dist/bbhj_online.dylib $slices || true; fi
          fi

          if [ -n "$ENT" ]; then ldid -S"$ENT" dist/bbhj_online.dylib; else ldid -S dist/bbhj_online.dylib; fi
          lipo -info dist/bbhj_online.dylib
          otool -L dist/bbhj_online.dylib | head -20
          shasum -a 256 dist/bbhj_online.dylib | tee dist/SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish base64 parts
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*kPluginVersion @"\([^"]*\)".*/\1/p' core/PluginInfo.h | head -1)
          [ -z "$VER" ] && VER=0.0
          rm -rf pub && mkdir -p pub
          python3 - <<'PY'
          import base64, hashlib, os
          data = open('dist/bbhj_online.dylib','rb').read()
          b64 = base64.b64encode(data).decode()
          step = 180000
          parts = [b64[i:i+step] for i in range(0, len(b64), step)]
          names = []
          for i, p in enumerate(parts):
              name = 'part-%02d.txt' % i
              open(os.path.join('pub', name), 'w').write(p)
              names.append(name)
          open('pub/index.txt','w').write('\n'.join(names) + '\n')
          open('pub/SHA256.txt','w').write(hashlib.sha256(data).hexdigest() + '\n')
          open('pub/VERSION.txt','w').write(open('core/PluginInfo.h').read().split('@"')[1] + '\n')
          print('parts:', len(parts), 'bytes:', len(data))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-artifacts
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f pub
          git commit -m "build $VER ${GITHUB_SHA:0:8}"
          git push -f origin build-artifacts
